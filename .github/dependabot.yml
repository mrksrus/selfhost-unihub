# Update proposals as pull requests; each runs the full CI of
# .github/workflows/docker-image.yml before anyone merges it. Minor and patch
# updates are grouped per ecosystem to keep the review queue short.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      frontend: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    groups:
      api: { update-types: [minor, patch] }
  # The interface check pins its browser and fonts on purpose: a new Playwright
  # changes the render identity and needs re-approved baselines.
  - package-ecosystem: npm
    directory: /tools/ui-regression
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
