name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mrksrus/selfhost-unihub
  # The synthetic providers of the e2e suite and the release checks
  # (scripts/install-test-providers.sh); GreenMail stays in one cache entry.
  GREENMAIL_VERSION: 2.1.15
  GREENMAIL_SHA256: 91d58798698cac357f015365240383b936ced2f2a1a9f7db37d9e3e1a31391b1
  RADICALE_VERSION: 3.5.10

# A newer push to a pull request replaces its run (the jobs below use up to
# the 20 runners a free account gets at once; more wait for a free one).
# Pushes and tags never cancel one another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

# The image is built once (build) and pushed to the registry under a run tag,
# candidate-run-<run>-<attempt>; every test job pulls exactly that digest.
# Only when every test job passed does publish give the digest its lasting
# tags (no rebuild): candidate-<tree> on a pull request, or latest, the
# version and the commit when publishing. Test jobs run side by side on
# standard runners; nothing large passes between jobs except through the
# registry.
jobs:
  # A release publishes what a pull request already tested. A pull request
  # from this repository keeps its tested image as candidate-<tree> (the git
  # tree of the tested merge). A push to main or a release tag with exactly
  # that content only adds its tags to that image: no rebuild, no second test
  # run. Without such an image (a direct push, or main moved after the test)
  # the jobs below build and test it here before publishing.
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # The run that tested a candidate, and its publish job's log.
      actions: read
    outputs:
      # Whether a tested image exists for this content. If it does and
      # publishing it fails, this run fails instead of building anew.
      found: ${{ steps.candidate.outputs.found }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The candidate tag is resolved once to its digest, and that digest is
      # published, so a later push of the tag cannot change what goes out. The
      # tag alone proves nothing (a failed publish could leave it behind): the
      # run named by the image's tested-run label must have published and read
      # back exactly this tag and digest (scripts/check-candidate-run.sh), or
      # the full build and tests run.
      - name: Find the image a pull request tested
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          candidate="$REGISTRY/$IMAGE_NAME:candidate-$tree"
          if ! digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}' 2>/dev/null)" || [ -z "$digest" ]; then
            echo "No tested image for this content ($candidate); the full build and tests run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME@$digest" --format '{{index .Image.Config.Labels "io.github.mrksrus.unihub.tested-run"}}' 2>/dev/null || true)"
          if ! bash scripts/check-candidate-run.sh "$candidate" "$digest" "$run"; then
            echo "$candidate ($digest) is not proven tested; the full build and tests run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "digest=$digest"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing the tested image"
            echo "- Content (git tree): \`$tree\`"
            echo "- Image: \`$REGISTRY/$IMAGE_NAME@$digest\`"
            if [ -n "$run" ]; then
              echo "- Tested in: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${run%%/*} (attempt ${run##*/})"
            else
              echo "- Tested in: unknown run (the image has no tested-run label)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the image a pull request tested
        if: steps.candidate.outputs.found == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          # A carbon copy: each tag names the tested digest itself, not a new
          # index around it.
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$REGISTRY/$IMAGE_NAME@$DIGEST"
          echo "- Published as: $(tr '\n' ' ' <<< "$IMAGE_TAGS")" >> "$GITHUB_STEP_SUMMARY"

      # Read back from the registry: a lost or wrong release tag fails here, never silently.
      - name: Verify the published tags
        if: steps.candidate.outputs.found == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}
        run: bash scripts/verify-image-tags.sh "$IMAGE" <<< "$IMAGE_TAGS"

  # Pull requests and manual runs skip promote; a push builds and tests only
  # when no tested image exists for its content (or promote could not look).
  # Every job below states its condition: a skipped promote would otherwise
  # skip them all.
  api-tests:
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # docker-compose.yml's MariaDB (LTS), and the one the TrueNAS catalog ships.
        mariadb: ["11.8", "13.0"]
    env:
      MYSQL_TEST_SCHEMA_SMOKE: "1"
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DATABASE: unihub_test
      MYSQL_TEST_USER: unihub_test
      MYSQL_TEST_PASSWORD: test-db-password
      ENCRYPTION_KEY: ci-test-encryption-key
      BACKUP_MASTER_KEY: ci-test-backup-master-key
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: unihub_test
          MARIADB_USER: unihub_test
          MARIADB_PASSWORD: test-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The tests run on the Node.js release the image pins (Dockerfile final
      # stage), also when Dependabot moves that pin.
      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api ci

      - name: Report known vulnerabilities in shipped API dependencies
        # A report, not a gate: an advisory without a fix must not block a
        # release. Dependabot (.github/dependabot.yml) proposes the updates.
        continue-on-error: true
        run: npm --prefix api audit --omit=dev --audit-level=high

      - name: Match the database settings of docker-compose.yml
        # Service containers take no command options; tests also open their own pools.
        run: docker exec ${{ job.services.mariadb.id }} mariadb -uroot -ptest-root-password -e "SET GLOBAL innodb_snapshot_isolation = OFF"

      # The instance backup's test dumps and loads the database with the
      # MariaDB client tools, as the image does (mariadb-dump, mariadb). These
      # run them inside the database's own container, the server's release:
      # nothing to install, and no clash with the runner's MySQL client. The
      # test passes the password in MYSQL_PWD, which docker exec hands on.
      - name: Provide the MariaDB client tools
        env:
          DATABASE: ${{ job.services.mariadb.id }}
        run: |
          bin="$RUNNER_TEMP/mariadb-client"
          mkdir -p "$bin"
          for tool in mariadb mariadb-dump; do
            # The API starts them with a bare environment; docker reads its configuration under HOME.
            printf '#!/bin/sh\nexport HOME="${HOME:-%s}"\nexec docker exec -i -e MYSQL_PWD %s %s "$@"\n' "$HOME" "$DATABASE" "$tool" > "$bin/$tool"
            chmod +x "$bin/$tool"
          done
          "$bin/mariadb-dump" --version
          echo "UNIHUB_MARIADB_BIN_DIR=$bin" >> "$GITHUB_ENV"

      - name: Run API tests
        run: npm --prefix api run test:ci

  frontend:
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api ci

      - name: Report known vulnerabilities in shipped frontend dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend checks
        run: |
          npm test -- --run
          npm run lint
          npm run build

      # The logic of the release checks below (evidence, release window, IMAP log), with fakes.
      - name: Test the release checks
        run: |
          npm run typecheck:scripts
          node --test scripts/release-checks.test.mts

      - name: Verify the pinned interface
        run: |
          npm --prefix tools/ui-regression ci
          npm --prefix tools/ui-regression run browsers -- --with-deps
          npm --prefix tools/ui-regression run typecheck
          npm --prefix tools/ui-regression run verify

      - name: Keep interface regression reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-interface-regression
          path: |
            tools/ui-regression/report/
            tools/ui-regression/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The image, built once. Its Android app (Android SDK and Gradle inside the
  # build) is kept as a small artifact for the emulator jobs and for trying it
  # on a phone; the image itself only travels through the registry.
  build:
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      # <registry>/<name>@<digest>, or empty when this run cannot push (a pull
      # request from a fork): the test jobs then build the same commit themselves.
      image: ${{ steps.push.outputs.image }}
      run-tag: ${{ steps.push.outputs.run-tag }}
      tree: ${{ steps.push.outputs.tree }}
      signing: ${{ steps.app.outputs.signing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      # Phones only update the Android app when every release is signed with
      # the same key, so a published image must never carry a throwaway key.
      # Without the secrets (pull requests from forks) the files stay empty and
      # android/scripts/build-apk.sh signs with a throwaway key.
      - name: Prepare the Android signing key
        id: android-key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PUBLISHING: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          if [ "$PUBLISHING" = true ] && { [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; }; then
            echo "Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see docs/ANDROID.md)." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/android-signing/keystore"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/android-signing/password"
          # Names the key for Docker's build cache (Dockerfile, UNIHUB_ANDROID_SIGNER).
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "key=release-$(sha256sum "$RUNNER_TEMP/android-signing/keystore" | cut -c 1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "key=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          # The build summary stays; its record artifact (kept 90 days) is not needed.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: unihub:ci
          # The run that tests this image, so a published image leads back to
          # its evidence (promote above).
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.github.mrksrus.unihub.tested-run=${{ github.run_id }}/${{ github.run_attempt }}
          build-args: |
            UNIHUB_ANDROID_SIGNER=${{ steps.android-key.outputs.key }}
          secret-files: |
            android_keystore=${{ runner.temp }}/android-signing/keystore
            android_keystore_password=${{ runner.temp }}/android-signing/password

      # The app is kept with each run (Artifacts) for trying it on a phone.
      - name: Check and keep the Android app
        id: app
        env:
          PUBLISHING: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          container="$(docker create unihub:ci)"
          mkdir -p android-app
          docker cp "$container:/app/downloads/." android-app/
          docker rm "$container" >/dev/null
          cat android-app/unihub-android.json
          if [ "$PUBLISHING" = true ] && ! grep -q '"signing":"release"' android-app/unihub-android.json; then
            echo "The app is not signed with the release key." >&2
            exit 1
          fi
          if grep -q '"signing":"release"' android-app/unihub-android.json; then
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=other" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the Android app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-android-app
          path: android-app/
          retention-days: 14

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Under a tag of this run only: nothing finds it as tested until publish
      # below adds candidate-<tree> or the release tags. prune-candidates.yml
      # deletes it after 30 days unless a release adopted it.
      - name: Push the image under test
        id: push
        env:
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [ "$CAN_PUSH" != true ]; then
            echo "A pull request from a fork cannot push; each test job builds this commit itself."
            echo "image=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$REGISTRY/$IMAGE_NAME:candidate-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag unihub:ci "$tag"
          docker push --quiet "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $tag" >&2; exit 1; }
          echo "image=$REGISTRY/$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "run-tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Image under test"
            echo "- \`$REGISTRY/$IMAGE_NAME@$digest\` ($tag)"
            echo "- App: $(cat android-app/unihub-android.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The current app and those of the three releases before it, read from
  # their published images and checked against recorded hashes. Needs only
  # the source (the candidate app's place is fixed), so it runs beside build.
  android-window:
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Release tags define the support window (android/support-window.json).
          fetch-depth: 0
          fetch-tags: true

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Build the API
        run: |
          npm --prefix api ci
          npm --prefix api run build

      - name: Collect the Android support window
        run: node scripts/android-support-window.mts --candidate android-app --out android-window

      - name: Keep the support window for the emulator jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-android-window
          path: android-window/
          retention-days: 1

  # The image starts as in production, a full backup moves to a fresh,
  # independent installation and its provider data comes back from the
  # providers, an instance backup restores the whole installation, and an
  # open web app updates to this build.
  container:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DATABASE: unihub_test
      MYSQL_TEST_USER: unihub_test
      MYSQL_TEST_PASSWORD: test-db-password
      ENCRYPTION_KEY: ci-test-encryption-key
      BACKUP_MASTER_KEY: ci-test-backup-master-key
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: unihub_test
          MARIADB_USER: unihub_test
          MARIADB_PASSWORD: test-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api ci

      - name: Match the database settings of docker-compose.yml
        run: docker exec ${{ job.services.mariadb.id }} mariadb -uroot -ptest-root-password -e "SET GLOBAL innodb_snapshot_isolation = OFF"

      - name: Cache GreenMail
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unihub-e2e/greenmail
          key: greenmail-${{ env.GREENMAIL_VERSION }}

      - name: Install the synthetic providers
        run: bash scripts/install-test-providers.sh

      # The web build the checks below serve is the image's own.
      - name: Pull the image under test
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -n "$IMAGE" ]; then docker pull --quiet "$IMAGE" && docker tag "$IMAGE" unihub:ci
          else docker build --quiet --tag unihub:ci .; fi
          container="$(docker create unihub:ci)"
          rm -rf dist && mkdir dist
          docker cp "$container:/usr/share/nginx/html/." dist/
          docker rm "$container" >/dev/null

      - name: Test container startup, auth and recording round-trip
        run: bash scripts/container-smoke.sh

      # Two installations of the image with their own MariaDB, uploads and
      # keys: a full backup of synthetic data in every section moves to the
      # other after the first is deleted, without the provider data, survives
      # a restart there, and its passwords sign in to the test providers, from
      # which the Sync-mode mail and the CalDAV event come back
      # (docs/RELEASE_CONTRACT.md).
      - name: Restore a full backup into a fresh, independent installation
        env:
          UNIHUB_RECOVERY_EVIDENCE: release-evidence/recovery.json
        run: |
          mkdir -p release-evidence
          node scripts/recovery-fresh-install.mts --image unihub:ci

      # Back up now on an installation with the instance backup on (test key
      # and destination), then the restore command in the image into an
      # empty installation with the old keys.
      - name: Restore an instance backup into an empty installation
        env:
          UNIHUB_INSTANCE_DRILL_EVIDENCE: release-evidence/instance-drill.json
        run: node scripts/instance-backup-drill.mts --image unihub:ci

      # The same on the MariaDB the TrueNAS catalog ships: the image's own
      # client tools dump and load a server newer than they are.
      - name: Restore an instance backup on MariaDB 13.0
        env:
          UNIHUB_DB_IMAGE: mariadb:13.0
          UNIHUB_INSTANCE_DRILL_EVIDENCE: release-evidence/instance-drill-mariadb-13.json
        run: node scripts/instance-backup-drill.mts --image unihub:ci

      # In Chrome: this build's worker hands over to a following build while a
      # request hangs and another tab has unsaved input and an upload; and
      # every earlier release in the support window updates to this build.
      # Exit 75: headless Chrome stopped answering (not an app failure); that
      # check runs once more. Any other failure fails the step at once.
      - name: Update the open web app
        run: |
          check() {
            local code=0
            node scripts/pwa-update-check.mts "$@" || code=$?
            if [ "$code" -eq 75 ]; then
              echo "Chrome stopped answering; running this check once more."
              code=0
              node scripts/pwa-update-check.mts "$@" || code=$?
            fi
            return "$code"
          }
          check --image unihub:ci
          versions="$(node -p 'require("./android/support-window.json").releases.slice(1).map(release => release.version).join(" ")')"
          [ -n "$versions" ] || { echo "No earlier release in android/support-window.json" >&2; exit 1; }
          for version in $versions; do
            check --image unihub:ci --old "$version" --new dist
          done

      - name: Keep the release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-evidence-part-container-attempt${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: ignore
          # Until evidence below gathered the run's complete evidence; longer
          # only so a re-run of failed jobs within the week finds it.
          retention-days: 7

  # Building the app does not show that it starts. Start it, and the apps of
  # the support window, on the oldest Android it supports, a current one and
  # Android 17, where a phone reported the crash fixed in 0.21.4. Apps known
  # to be broken must still fail as recorded; updating from the previous
  # release's app must keep the saved server, and its contacts on the phone.
  # The Android 10 image's WebView (74) cannot run the web app, which needs
  # a current WebView as on any updated phone, so the real-server check runs
  # on Android 16 only (docs/ANDROID_COMPATIBILITY.md).
  android-10:
    needs: [build, android-window]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android-window.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Fetch the Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-app
          path: android-app

      - name: Fetch the support window
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-window
          path: android-window

      # The app built into the image under test, byte for byte.
      - name: Check the app against its image's record
        run: node -e 'const fs=require("fs"),crypto=require("crypto");const meta=JSON.parse(fs.readFileSync("android-app/unihub-android.json"));const apk=fs.readFileSync("android-app/unihub.apk");if(crypto.createHash("sha256").update(apk).digest("hex")!==meta.sha256||apk.length!==meta.size){console.error("android-app/unihub.apk does not match unihub-android.json");process.exit(1)}console.log("App",meta.sha256)'

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the Android apps on Android 10
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash android/scripts/window-test.sh android-window android-app/unihub.apk android-app/unihub-android.json
            bash android/scripts/contacts-test.sh android-app/unihub.apk "$(f="android-window/$(cat android-window/upgrade-from)/unihub.apk"; [ -f "$f" ] && echo "$f")"
            bash android/scripts/notifications-test.sh android-app/unihub.apk

  # Android 16 runs the same three checks as Android 10, each on its own
  # emulator so they run side by side.
  android-16:
    needs: [build, android-window]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android-window.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: support window
            script: 'bash android/scripts/window-test.sh android-window android-app/unihub.apk android-app/unihub-android.json'
          - check: contacts
            script: 'bash android/scripts/contacts-test.sh android-app/unihub.apk "$(f="android-window/$(cat android-window/upgrade-from)/unihub.apk"; [ -f "$f" ] && echo "$f")"'
          - check: notifications
            script: 'bash android/scripts/notifications-test.sh android-app/unihub.apk'
    name: android-16 (${{ matrix.check }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Fetch the Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-app
          path: android-app

      - name: Fetch the support window
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-window
          path: android-window

      - name: Check the app against its image's record
        run: node -e 'const fs=require("fs"),crypto=require("crypto");const meta=JSON.parse(fs.readFileSync("android-app/unihub-android.json"));const apk=fs.readFileSync("android-app/unihub.apk");if(crypto.createHash("sha256").update(apk).digest("hex")!==meta.sha256||apk.length!==meta.size){console.error("android-app/unihub.apk does not match unihub-android.json");process.exit(1)}console.log("App",meta.sha256)'

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the Android apps on Android 16 (${{ matrix.check }})
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ${{ matrix.script }}

  # The apps against real servers on Android 16: the candidate app against
  # this image and the earlier server releases, and the earlier apps against
  # this image, each with its own empty database and synthetic people
  # (scripts/android-server-check.mts). The pairings are split over four
  # emulators; together they run each pairing once.
  android-16-servers:
    needs: [build, android-window]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android-window.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: android-16-servers (part ${{ matrix.part }} of 4)
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DATABASE: unihub_test
      MYSQL_TEST_USER: unihub_test
      MYSQL_TEST_PASSWORD: test-db-password
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: unihub_test
          MARIADB_USER: unihub_test
          MARIADB_PASSWORD: test-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm --prefix api ci

      - name: Match the database settings of docker-compose.yml
        run: docker exec ${{ job.services.mariadb.id }} mariadb -uroot -ptest-root-password -e "SET GLOBAL innodb_snapshot_isolation = OFF"

      - name: Fetch the Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-app
          path: android-app

      - name: Fetch the support window
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-window
          path: android-window

      - name: Check the app against its image's record
        run: node -e 'const fs=require("fs"),crypto=require("crypto");const meta=JSON.parse(fs.readFileSync("android-app/unihub-android.json"));const apk=fs.readFileSync("android-app/unihub.apk");if(crypto.createHash("sha256").update(apk).digest("hex")!==meta.sha256||apk.length!==meta.size){console.error("android-app/unihub.apk does not match unihub-android.json");process.exit(1)}console.log("App",meta.sha256)'

      # The earlier server releases too, so the emulator's time goes to the app.
      - name: Pull the image under test and the earlier server releases
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -n "$IMAGE" ]; then docker pull --quiet "$IMAGE" && docker tag "$IMAGE" unihub:ci
          else docker build --quiet --tag unihub:ci .; fi
          versions="$(node -p 'require("./android/support-window.json").releases.slice(1).map(release => release.version).join(" ")')"
          [ -n "$versions" ] || { echo "No earlier release in android/support-window.json" >&2; exit 1; }
          for version in $versions; do
            docker pull --quiet "$REGISTRY/$IMAGE_NAME:$version"
          done

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the apps against real servers on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          # With audio: the check records with the emulator's microphone.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          script: node scripts/android-server-check.mts --window android-window --candidate-apk android-app/unihub.apk --candidate-image unihub:ci --part ${{ matrix.part }}/4 --evidence release-evidence/android-server

      - name: Keep the release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-evidence-part-android-server-${{ matrix.part }}-attempt${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # The system image is named android-37.0 (stable channel). That image
  # (google_apis x86_64, revision 6) is broken as of 2026-10-16: its
  # surfaceflinger aborts right after boot ("!rcEnc->featureInfo()->
  # hasReadColorBufferDma") with every -gpu mode, so the system restarts
  # and installs fail before any app runs. Waiting for its boot timeout
  # cost eleven minutes a run, so the job runs only with the repository
  # variable UNIHUB_ANDROID17 set to true (try a new image that way); it
  # does not block a release until a working image ships. Android 17 is
  # checked on a real phone meanwhile (docs/ANDROID_COMPATIBILITY.md).
  android-17:
    needs: [build, android-window]
    if: ${{ !cancelled() && vars.UNIHUB_ANDROID17 == 'true' && needs.build.result == 'success' && needs.android-window.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Fetch the Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-app
          path: android-app

      - name: Fetch the support window
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unihub-android-window
          path: android-window

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the Android apps on Android 17
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash android/scripts/window-test.sh android-window android-app/unihub.apk android-app/unihub-android.json
            bash android/scripts/contacts-test.sh android-app/unihub.apk "$(f="android-window/$(cat android-window/upgrade-from)/unihub.apk"; [ -f "$f" ] && echo "$f")"
            bash android/scripts/notifications-test.sh android-app/unihub.apk

  # The end-to-end suite (tools/e2e) against the image under test: its nginx
  # and API with MariaDB 11.8 in containers as in docker-compose.yml, and
  # GreenMail and Radicale as synthetic mail and CalDAV providers behind a
  # test CA (tools/e2e/stack.sh with UNIHUB_E2E_IMAGE). One target per runner;
  # desktop, which runs most tests, in three: the two files that wait longest
  # on server timers each alone, and every other file. Real-provider tests
  # stay local: they need private accounts.
  e2e:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The files run alone here are left out of "the rest" (DESKTOP_ALONE),
          # which is split by turns over its sorted files.
          - { target: desktop, part: scheduled send, only: tests/mail/scheduled-send.e2e.ts }
          - { target: desktop, part: snooze, only: tests/mail/snooze.e2e.ts }
          - { target: desktop, part: the rest 1 of 2, rest: 1 }
          - { target: desktop, part: the rest 2 of 2, rest: 2 }
          - { target: phone }
          - { target: android-app }
    name: e2e (${{ matrix.target }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    env:
      UNIHUB_E2E_IMAGE: unihub:ci
      UNIHUB_E2E_STATE: ${{ github.workspace }}/.e2e-state
      UNIHUB_E2E_CA: ${{ github.workspace }}/.e2e-ca
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.e2e-browsers
      E2E_TELEMETRY_DISABLED: "1"
      DESKTOP_REST_PARTS: "2"
      DESKTOP_ALONE: tests/mail/scheduled-send.e2e.ts tests/mail/snooze.e2e.ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm --prefix api ci
          npm --prefix tools/e2e ci
          node tools/e2e/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Cache GreenMail
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unihub-e2e/greenmail
          key: greenmail-${{ env.GREENMAIL_VERSION }}

      # GreenMail from Maven Central and Radicale from PyPI, both pinned.
      - name: Install the synthetic providers
        run: |
          bash scripts/install-test-providers.sh
          # The providers use the standard ports 993 and 465.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      - name: Pull the image under test
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -n "$IMAGE" ]; then docker pull --quiet "$IMAGE" && docker tag "$IMAGE" unihub:ci
          else docker build --quiet --tag unihub:ci .; fi

      - name: Start the end-to-end stack
        run: tools/e2e/stack.sh up

      - name: Run the end-to-end suite (${{ matrix.target }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
        working-directory: tools/e2e
        env:
          TARGET: ${{ matrix.target }}
          ONLY: ${{ matrix.only }}
          REST: ${{ matrix.rest }}
        run: |
          files=()
          if [ -n "$ONLY" ]; then
            files=("$ONLY")
          elif [ -n "$REST" ]; then
            mapfile -t files < <(find tests -name '*.e2e.ts' | sort | grep -v -x -F $(printf -- '-e %s ' $DESKTOP_ALONE) \
              | awk -v part="$REST" -v parts="$DESKTOP_REST_PARTS" '(NR - 1) % parts == part - 1')
            [ "${#files[@]}" -gt 0 ] || { echo "No files in part $REST of $DESKTOP_REST_PARTS" >&2; exit 1; }
          fi
          npx e2e run --exclude-tag providers --target "$TARGET" "${files[@]}"

      - name: Show the stack's logs
        if: failure()
        run: |
          docker logs --tail 200 unihub-e2e-app || true
          tail -n 50 "$UNIHUB_E2E_STATE"/log/*.log || true

      # Synthetic data only; the cached sign-in sessions stay behind.
      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-e2e-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            tools/e2e/.e2e/
            !tools/e2e/.e2e/sessions/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The flows under tools/e2e/android/ with the candidate's debug app in an
  # Android 16 emulator against this source's e2e stack (its local mode: the
  # tests read the host's nginx logs, and the stack offers the debug app at
  # /downloads/unihub.apk), on a standard runner. Only the image's nginx
  # mime.types come from the image under test. Each file that fails runs
  # again on its own, up to twice; the summary lists every attempt.
  android-e2e:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UNIHUB_E2E_STATE: ${{ github.workspace }}/.e2e-state
      UNIHUB_E2E_CA: ${{ github.workspace }}/.e2e-ca
      UNIHUB_E2E_EMULATOR_PORT: "5560"
      SUITE_LOGS: ${{ github.workspace }}/android-e2e-logs
      # The MariaDB tarball of docs/DEVELOPMENT.md (scripts/local-db.sh).
      MARIADB_VERSION: 11.8.9
      MARIADB_SHA256: 32f8871a2aa38b36aa418b7f4abc6fc0c6ef1ba5a45798cacb2afa52c8a6113b
      # The app the contacts update case (26-09) starts from.
      PREVIOUS_APP: 0.25.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          npm ci
          npm --prefix api ci
          npm --prefix tools/e2e ci

      - name: Cache GreenMail
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unihub-e2e/greenmail
          key: greenmail-${{ env.GREENMAIL_VERSION }}

      - name: Install the synthetic providers
        run: |
          bash scripts/install-test-providers.sh
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      # nginx with the mime.types of the image under test (read from the
      # registry; a fork's run builds this commit), and MariaDB from its tarball.
      - name: Install nginx and MariaDB
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx >/dev/null
          sudo systemctl stop nginx || true
          if [ -n "$IMAGE" ]; then docker pull --quiet "$IMAGE" && docker tag "$IMAGE" unihub:ci
          else docker build --quiet --tag unihub:ci .; fi
          container="$(docker create unihub:ci)"
          docker cp "$container:/etc/nginx/mime.types" "$RUNNER_TEMP/mime.types"
          docker rm "$container" >/dev/null
          docker image rm unihub:ci >/dev/null
          tarball="mariadb-$MARIADB_VERSION-linux-systemd-x86_64.tar.gz"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/$tarball" "https://downloads.mariadb.org/rest-api/mariadb/$MARIADB_VERSION/$tarball"
          echo "$MARIADB_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mariadb"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/mariadb" --strip-components=1
          rm -f -- "$RUNNER_TEMP/$tarball"
          {
            echo "UNIHUB_E2E_NGINX=/usr/sbin/nginx"
            echo "UNIHUB_E2E_MIME_TYPES=$RUNNER_TEMP/mime.types"
            echo "UNIHUB_DB_HOME=$RUNNER_TEMP/mariadb"
          } >> "$GITHUB_ENV"

      # Debug builds as tools/e2e/android.sh builds them, both in this job so
      # they share the runner's debug key (26-09 updates the installed app).
      # The candidate's stays where the stack offers it.
      - name: Build the debug apps
        run: |
          build() { (cd "$1/android" && ./gradlew -q --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebug); }
          build .
          git worktree add --detach "$RUNNER_TEMP/src-$PREVIOUS_APP" "v$PREVIOUS_APP"
          build "$RUNNER_TEMP/src-$PREVIOUS_APP"
          mkdir -p "$RUNNER_TEMP/apps"
          cp "$RUNNER_TEMP/src-$PREVIOUS_APP/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/apps/unihub-$PREVIOUS_APP-debug.apk"
          git worktree remove --force "$RUNNER_TEMP/src-$PREVIOUS_APP"
          echo "UNIHUB_E2E_PREVIOUS_APK=$RUNNER_TEMP/apps/unihub-$PREVIOUS_APP-debug.apk" >> "$GITHUB_ENV"

      - name: Start the end-to-end stack
        run: tools/e2e/stack.sh up

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action runs each script line on its own, so the suite is one script.
      - name: Write the suite script
        run: |
          cat > "$RUNNER_TEMP/android-e2e.sh" <<'SUITE'
          #!/usr/bin/env bash
          # npm run android's files once, one at a time (one emulator), then
          # each failing file again on its own, up to twice.
          set -u
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$SUITE_LOGS"
          adb() { "$ANDROID_HOME/platform-tools/adb" -s "emulator-$UNIHUB_E2E_EMULATOR_PORT" "$@"; }
          adb logcat -v time > "$SUITE_LOGS/logcat.txt" 2>&1 &
          logcat=$!
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          counts() { grep -E '^ℹ (pass|fail|skipped|cancelled) ' "$1" | sed 's/^ℹ //' | paste -sd, -; }
          run() { # <log> <files...> (relative to tools/e2e)
            local log=$1; shift
            echo "::group::$(basename "$log")"
            (cd tools/e2e && node --test --test-concurrency=1 "$@") > "$log" 2>&1
            local status=$?
            grep -E '^(✔|✖|﹣)' "$log"
            echo "::endgroup::"
            return $status
          }
          tools/e2e/android.sh up --no-build
          summary "### Android e2e (candidate debug app, Android 16)"
          run "$SUITE_LOGS/suite.1.log" 'android/*.test.mjs'; suite=$?
          summary "- suite: exit $suite ($(counts "$SUITE_LOGS/suite.1.log"))"
          summary '```'
          grep -E '^(✔|✖|﹣)' "$SUITE_LOGS/suite.1.log" | cut -c1-160 >> "$GITHUB_STEP_SUMMARY"
          summary '```'
          result=0
          failed=$(sed -n '/failing tests:/,$p' "$SUITE_LOGS/suite.1.log" | grep -oE '^test at android/[a-z0-9-]+\.test\.mjs' | sed 's/^test at //' | sort -u)
          for file in $failed; do
            name=$(basename "$file" .test.mjs)
            passed=false
            for attempt in 2 3; do
              tools/e2e/android.sh up --no-build
              if run "$SUITE_LOGS/$name.$attempt.log" "$file"; then passed=true; fi
              summary "- $name attempt $attempt: $($passed && echo pass || echo fail) ($(counts "$SUITE_LOGS/$name.$attempt.log"))"
              $passed && break
            done
            $passed || result=1
          done
          # A failed run whose failing files could not be read fails as it is.
          [ "$suite" = 0 ] || [ -n "$failed" ] || result=1
          kill "$logcat" 2>/dev/null || true
          exit $result
          SUITE
          chmod +x "$RUNNER_TEMP/android-e2e.sh"

      - name: Run the Android suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          # tools/e2e/android.sh only touches the test AVD on its port.
          avd-name: unihub35
          emulator-port: 5560
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -prop ro.hw_timeout_multiplier=3
          script: bash "$RUNNER_TEMP/android-e2e.sh"

      - name: Show the stack's logs
        if: failure()
        run: tail -n 50 "$UNIHUB_E2E_STATE"/log/*.log || true

      # Synthetic data only.
      - name: Keep the Android e2e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-android-e2e-attempt${{ github.run_attempt }}
          path: |
            android-e2e-logs/
            .e2e-state/log/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop the stack
        if: always()
        run: tools/e2e/stack.sh down || true

  # Each of the three releases before this one upgrades to the image under
  # test with its data, and its export imports into a fresh installation
  # (scripts/upgrade-check.mts, docs/RELEASE_CONTRACT.md). The releases are
  # the newest published ones up to this version: release tags whose image is
  # in the registry. Each job pulls its release by version tag and the image
  # under test by digest, and runs both against MariaDB 11.8 containers on
  # private networks, with GreenMail and Radicale as the providers.
  upgrade:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        previous: [1, 2, 3]
    name: upgrade (previous release ${{ matrix.previous }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm --prefix api ci

      - name: Cache GreenMail
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unihub-e2e/greenmail
          key: greenmail-${{ env.GREENMAIL_VERSION }}

      - name: Install the synthetic providers
        run: |
          bash scripts/install-test-providers.sh
          # Their SMTP listens on 465, where the API uses implicit TLS.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      - name: Pull the image under test
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -n "$IMAGE" ]; then docker pull --quiet "$IMAGE" && docker tag "$IMAGE" unihub:ci
          else docker build --quiet --tag unihub:ci .; fi

      - name: Upgrade the previous release ${{ matrix.previous }} to this image
        run: node scripts/upgrade-check.mts --previous ${{ matrix.previous }} --image unihub:ci --evidence release-evidence/upgrade/previous-${{ matrix.previous }}.json

      - name: Keep the release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-evidence-part-upgrade-${{ matrix.previous }}-attempt${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # Gathers the evidence of the test jobs into one bundle and checks that it
  # is complete; publish needs that check. Each part is uploaded per attempt
  # (unihub-evidence-part-<part>-attempt<n>, 7 days): a re-run replaces the
  # parts it re-ran and keeps the rest, from their uploads or from the bundle
  # an earlier attempt kept (scripts/collect-release-evidence.mts). Only a
  # complete bundle is stored, under this attempt's name
  # (unihub-release-evidence-attempt<n>, 30 days); after it is stored, the
  # parts and earlier bundles are deleted (scripts/release-evidence.sh). An
  # incomplete attempt stores nothing and deletes nothing: its parts stay for
  # a re-run, and an earlier complete bundle stays as it was.
  evidence:
    needs: [build, container, android-16-servers, upgrade]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the artifacts of every attempt; deletes the parts once the bundle
      # is stored. A pull request from a fork gets a read-only token: it skips
      # the deleting, and the parts expire.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the image's Node.js version
        id: node
        run: |
          version="$(grep -E '^FROM ' Dockerfile | tail -n 1 | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine@sha256:[0-9a-f]{64}$/\1/p')"
          [ -n "$version" ] || { echo 'The Dockerfile final stage must be FROM node:<x.y.z>-alpine@sha256:<digest>.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Fetch the evidence of every attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-evidence.sh fetch evidence-parts evidence-earlier

      - name: Gather and check the release evidence
        run: node scripts/collect-release-evidence.mts --parts evidence-parts --previous evidence-earlier --out release-evidence

      - name: Keep the release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unihub-release-evidence-attempt${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Delete the parts and earlier bundles
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-evidence.sh clean

  # Every test job passed: the tested digest gets its lasting tags. Nothing is
  # built here.
  publish:
    needs: [build, api-tests, frontend, android-window, container, android-10, android-16, android-16-servers, e2e, android-e2e, upgrade, evidence]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.image != ''
        && needs.api-tests.result == 'success' && needs.frontend.result == 'success'
        && needs.android-window.result == 'success' && needs.container.result == 'success'
        && needs.android-10.result == 'success' && needs.android-16.result == 'success'
        && needs.android-16-servers.result == 'success' && needs.e2e.result == 'success'
        && needs.android-e2e.result == 'success'
        && needs.upgrade.result == 'success' && needs.evidence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      PUBLISHING: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      KEEPING: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # For scripts/verify-image-tags.sh only; nothing is built.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Log in to Container Registry
        if: env.PUBLISHING == 'true' || env.KEEPING == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before any lasting tag: the run tag must still name the tested digest.
      - name: Read back the image under test
        if: env.PUBLISHING == 'true' || env.KEEPING == 'true'
        env:
          RUN_TAG: ${{ needs.build.outputs.run-tag }}
        run: bash scripts/verify-image-tags.sh "$IMAGE" <<< "$RUN_TAG"

      # A carbon copy (--prefer-index=false): each tag names the tested digest
      # itself, not a new index around it (read back below).
      - name: Publish the tested image
        if: env.PUBLISHING == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE"
          bash scripts/verify-image-tags.sh "$IMAGE" <<< "$IMAGE_TAGS"
          {
            echo "### Published the tested image"
            echo "- Image: \`$IMAGE\`"
            echo "- Published as: $(tr '\n' ' ' <<< "$IMAGE_TAGS")"
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept for the release that merges exactly this content (promote above).
      # Only with the release-signed app: a published image must carry it. The
      # last write of the run, after every check; promote also confirms that
      # this job succeeded and read the tag back (scripts/check-candidate-run.sh).
      - name: Keep the tested image for its release
        if: env.KEEPING == 'true'
        env:
          TREE: ${{ needs.build.outputs.tree }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          if [ "$SIGNING" != release ]; then
            echo "The app is not release-signed; this image cannot be published, so it is not kept."
            exit 0
          fi
          candidate="$REGISTRY/$IMAGE_NAME:candidate-$TREE"
          docker buildx imagetools create --prefer-index=false --tag "$candidate" "$IMAGE"
          bash scripts/verify-image-tags.sh "$IMAGE" <<< "$candidate"
          echo "### Kept the tested image as \`$candidate\` ($IMAGE)" >> "$GITHUB_STEP_SUMMARY"
