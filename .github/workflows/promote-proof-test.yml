name: Throwaway promote proof (ci/promote-proof)

# Runs only the promote check on a push event, with promote's permissions,
# read-only against the candidate main could not promote. To be deleted.
on:
  push:
    branches: [ "ci/promote-proof" ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: gh version
        run: gh --version
      - name: The candidate main could not promote (expect proven)
        run: bash scripts/check-candidate-run.sh ghcr.io/mrksrus/selfhost-unihub:candidate-627f95286fdae9f93c9559030477d682b4fccb35 sha256:44f7ebc2dd5f7da60e8ac0c9e102c197296815340bdb915ca9bbf3e574a1d074 41187494727/1
      - name: The tag a failed publish left (expect not proven)
        run: |
          if bash scripts/check-candidate-run.sh ghcr.io/mrksrus/selfhost-unihub:candidate-9f1e4882d75065e92bd49b4877e8a46f2cea0434 sha256:7f1c73d1314095afce76664fa521c5b0c2718bcd461b229c9c741148fe482810 41181609353/1; then echo "::error::proved a failed publish"; exit 1; fi
          echo "refused as required"
      - name: The old gh path (expect the escape-sequence refusal)
        run: |
          if gh api repos/$GITHUB_REPOSITORY/actions/jobs/124503638861/logs > /dev/null; then echo "gh printed the log here"; else echo "gh refused, as on main"; fi
