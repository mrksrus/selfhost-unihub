services:
  # ── UniHub Application (Frontend + API) ─────────────────────────
  #
  # Bootstrap admin account (required on first start):
  #   UNIHUB_BOOTSTRAP_ADMIN_EMAIL + UNIHUB_BOOTSTRAP_ADMIN_PASSWORD
  # Password must be at least 12 characters.
  #
  unihub:
    # Image tag options:
    #   :latest   newest build of the main branch; combined with pull_policy:
    #             always, a container restart is the update (default)
    #   :0.11.0   one exact tagged release; update by editing this tag
    # Database upgrades run on startup and cannot be undone by switching back to
    # an older image. Take a backup before a restart that may pull a new release.
    image: ghcr.io/mrksrus/selfhost-unihub:latest
    # Pull policy options:
    #   always    check the registry on every start (default, restart-to-update)
    #   missing   pull only when no local copy exists; update with docker compose pull
    #   never     use only a locally built or loaded image
    pull_policy: always
    container_name: unihub
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Nginx prepares nginx-owned log/temp paths, binds port 80, then
      # drops its worker processes to the nginx user/group. The start script
      # hands /app/uploads to uid 10001 and the API runs as that user.
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
      # Connection to the MariaDB service below. The MYSQL_ names are kept
      # because MariaDB speaks the MySQL protocol; UniHub 0.16+ needs MariaDB.
      MYSQL_DATABASE: unihub
      MYSQL_USER: unihub
      MYSQL_PASSWORD: ${UNIHUB_DB_PASSWORD:?Set UNIHUB_DB_PASSWORD to a strong database password before starting}
      MYSQL_HOST: unihub-db
      MYSQL_PORT: "3306"
      # ── Startup timing controls used by docker/start.sh ───────────────
      MYSQL_STARTUP_MAX_WAIT_SECONDS: "300"
      MYSQL_STARTUP_CHECK_INTERVAL_SECONDS: "5"
      UNIHUB_API_START_DELAY_SECONDS: "2"
      # ── Required: set a strong, random secret ──────────────────────
      # Generate one with:  openssl rand -base64 48
      JWT_SECRET: ${UNIHUB_JWT_SECRET:?Set UNIHUB_JWT_SECRET to a strong random value before starting}
      # ── Encryption key for stored email passwords ──────────────────
      ENCRYPTION_KEY: ${UNIHUB_ENCRYPTION_KEY:?Set UNIHUB_ENCRYPTION_KEY to a strong random value before starting}
      BACKUP_MASTER_KEY: ${UNIHUB_BACKUP_MASTER_KEY:-}
      # ── First-run admin bootstrap (required when users table is empty) ──
      BOOTSTRAP_ADMIN_EMAIL: ${UNIHUB_BOOTSTRAP_ADMIN_EMAIL:?Set UNIHUB_BOOTSTRAP_ADMIN_EMAIL before first startup}
      BOOTSTRAP_ADMIN_PASSWORD: ${UNIHUB_BOOTSTRAP_ADMIN_PASSWORD:?Set UNIHUB_BOOTSTRAP_ADMIN_PASSWORD before first startup}
      # ── CORS allowlist (comma-separated origins) ───────────────────
      ALLOWED_ORIGINS: "http://localhost:3000,https://mydomain.domain.com"
      # ── Trust proxy headers only when behind a trusted reverse proxy ──
      TRUST_PROXY_HEADERS: "true"
      # Include the bundled loopback proxy plus only your actual HTTPS proxy's
      # address/CIDR. Never trust all private networks or 0.0.0.0/0.
      TRUSTED_PROXY_CIDRS: ${UNIHUB_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      # ── Optional allowlist for self-hosted mail domains/IP hostnames ──
      TRUSTED_MAIL_HOSTS: mail.example.com
    depends_on:
      # Start once MariaDB reports ready; the app also waits for it itself.
      unihub-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 360s  # Covers the five-minute database wait plus API startup
    networks:
      - unihub-network
    volumes:
      - uploads_data:/app/uploads

  # ── MariaDB Database ────────────────────────────────────────────
  # Everything the database needs is in this file: no config files to download.
  unihub-db:
    # MariaDB 11.8 LTS (supported until 2030). Patch releases install with a
    # restart; MARIADB_AUTO_UPGRADE updates the system tables when needed.
    image: mariadb:11.8
    container_name: unihub-db
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_DATABASE: unihub
      MARIADB_USER: unihub
      MARIADB_PASSWORD: ${UNIHUB_DB_PASSWORD:?Set UNIHUB_DB_PASSWORD to a strong database password before starting}
      MARIADB_ROOT_PASSWORD: ${UNIHUB_DB_ROOT_PASSWORD:?Set UNIHUB_DB_ROOT_PASSWORD to a strong root database password before starting}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --innodb-buffer-pool-size=192M
      - --innodb-log-file-size=96M
      - --innodb-log-buffer-size=16M
      # Flush the log once per second instead of on every commit: much faster
      # mail syncs; a power loss can lose the last second of changes.
      - --innodb-flush-log-at-trx-commit=2
      # MySQL-style locking reads, which UniHub's transactions expect. The app
      # also sets this for its own connections.
      - --innodb-snapshot-isolation=OFF
      - --skip-name-resolve
      - --local-infile=0
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # The image's own check, using the health-check account it creates.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - unihub-network

networks:
  unihub-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  uploads_data:
    driver: local
