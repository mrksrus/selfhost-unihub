server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files with caching. Each location with its own add_header
    # re-includes the security headers (nginx inherits add_header all or nothing).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # PWA service worker - no caching
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.json {
        return 301 /manifest.webmanifest;
    }

    # Icons
    location /icons/ {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.conf;
    }

    # The Android app built into this image (android/, Dockerfile). Public, like
    # the page itself: the install offer links here before signing in. The file
    # changes with each image, so browsers revalidate it.
    location = /downloads/unihub.apk {
        alias /app/downloads/unihub.apk;
        # Alpine's mime.types has no entry for .apk.
        types { }
        default_type application/vnd.android.package-archive;
        expires -1;
    }

    # Stream backups, recordings and attachments directly instead of buffering them
    # to an nginx temp file. The API answers Range/If-Range so browsers can resume.
    location ~ ^/api/(backup/jobs/[^/]+/download|recordings/[^/]+/file|mail/attachments/[^/]+)$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;
        send_timeout 24h;
    }

    # Stream large restore archives to the API without nginx buffering the full upload.
    location = /api/backup/import {
        client_max_body_size 3900m;
        client_body_timeout 24h;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;
        send_timeout 24h;
    }

    # Live status updates (Server-Sent Events). Each event must reach the
    # browser at once, so nothing is buffered or compressed. The API sends
    # X-Accel-Buffering: no; proxy_pass_header passes it on (Nginx drops
    # X-Accel-* headers otherwise), so a reverse proxy in front, such as Nginx
    # Proxy Manager, does not buffer the stream either. A heartbeat comment every
    # 25 seconds keeps read timeouts from ending an idle stream. No add_header
    # here: that would drop the security headers inherited from nginx.conf.
    location = /api/events {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # The Android app's notification stream (api/src/services/android-push.ts)
    # needs the same, with a heartbeat every 45 seconds.
    location = /api/notifications/android/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # API proxy (very long timeouts for mail sync, which can take 30+ minutes for large mailboxes)
    location /api/ {
        # Compose attachments are base64 encoded in JSON. The API applies
        # endpoint-specific limits, including a 40 MiB cap for mail compose.
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 1800s;  # 30 minutes
        proxy_send_timeout 1800s;     # 30 minutes
        proxy_read_timeout 1800s;     # 30 minutes
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # Nginx answers 502-504 itself only for the proxied locations, when the API
    # does not answer (it is starting, restarting or stuck). Keep that status so
    # the app knows the API was not reached (src/lib/api.ts), with a JSON body it
    # can show. Errors the API sends itself pass through unchanged. Without this,
    # error_page pointed at a 50x.html the frontend does not have, and a restart
    # looked like "endpoint not found" (404).
    error_page 502 503 504 @api_unavailable;
    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":"UniHub is not answering right now. It may be starting or restarting; try again in a moment."}\n';
    }
}
