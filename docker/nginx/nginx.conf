worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    # Alpine's mime.types has no .mjs. The pdf.js worker is an ES module
    # (assets/pdf.worker.min-*.mjs), and with nosniff a browser refuses to load
    # it as application/octet-stream. A second types block adds to the map.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml;

    # HSTS only for a request that arrived over HTTPS: here (a certificate
    # mounted into this nginx) or at the reverse proxy in front of it, which
    # reports it in X-Forwarded-Proto. Browsers ignore the header over plain
    # HTTP, and an empty value sends none. A client that fakes the header only
    # pins HTTPS in its own browser.
    map "$scheme:$http_x_forwarded_proto" $unihub_hsts {
        default "";
        "~^https:" "max-age=31536000";
        "~:https(,|$)" "max-age=31536000";
    }

    # Security headers. Nginx inherits add_header only into locations that set
    # none of their own, so every location with an add_header includes this
    # file again (docker/nginx/default.conf).
    include /etc/nginx/security-headers.conf;

    include /etc/nginx/conf.d/*.conf;
}
