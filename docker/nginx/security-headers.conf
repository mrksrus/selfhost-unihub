# Security headers for every response. Included at the http level and inside
# each location that declares its own add_header, because nginx replaces the
# inherited add_header set entirely as soon as a level declares one. Keep the
# SSE/stream locations free of add_header so they inherit these as they are.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# 0 disables the legacy XSS auditor, which old browsers used as an XS-leak.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Empty (no header) unless the request came over HTTPS; see the map in nginx.conf.
add_header Strict-Transport-Security $unihub_hsts always;

# Content Security Policy. Scripts only from this origin (the pre-paint theme
# script is the file /theme-init.js for that reason); inline styles for component
# styles; data: and blob: for generated images, fonts and files. img-src also
# allows http(s): because the mail reader's srcdoc frame inherits this policy
# in addition to its own per-message policy (src/lib/email-privacy.ts), and
# that inner policy is what grants or withholds remote images per message. The
# page itself never renders sender HTML outside that frame.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

# Permissions Policy (formerly Feature-Policy)
# Restricts unnecessary browser features for security
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(), encrypted-media=(), fullscreen=(self), picture-in-picture=(), clipboard-read=(self), clipboard-write=(self), display-capture=(), screen-wake-lock=(), web-share=(self)" always;
